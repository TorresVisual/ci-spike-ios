name: Spike
options: { bundleIdPrefix: dev.example }
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging-Header.h
    HEADER_SEARCH_PATHS: $(SRCROOT)/Shared
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/build/rust/device
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/build/rust/sim
    OTHER_LDFLAGS: -lspike_core
targets:
  Spike:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spike
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Spike tests a Face ID gated keychain item
    entitlements:
      path: App/Spike.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.example.spike]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.example.spike.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: dev.example.spike }
    dependencies: [{ target: SpikeAutoFill }]
  SpikeAutoFill:
    type: app-extension
    platform: iOS
    sources: [AutoFill, Shared]
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Spike AutoFill
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities: { ProvidesPasswords: true }
    entitlements:
      path: AutoFill/SpikeAutoFill.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.example.spike]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.example.spike.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: dev.example.spike.autofill }
  SpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: Spike }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.spiketests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Spike.app/Spike
        BUNDLE_LOADER: $(TEST_HOST)
